services:
  bfsi-postgres:
    image: postgres:16
    container_name: bfsi-postgres
    environment:
      POSTGRES_DB: bfsi
      POSTGRES_USER: bfsi
      POSTGRES_PASSWORD: bfsi123
    ports:
      - "5432:5432"
    volumes:
      - bfsi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfsi -d bfsi"]
      interval: 5s
      timeout: 3s
      retries: 20

  customer-service:
    build: ./customer-service
    container_name: customer-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://bfsi-postgres:5432/bfsi
      SPRING_DATASOURCE_USERNAME: bfsi
      SPRING_DATASOURCE_PASSWORD: bfsi123

    depends_on:
      bfsi-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-service:
    build: ./payment-service
    container_name: payment-service
    environment:
      SERVER_PORT: 8082
      SERVER_ADDRESS: 0.0.0.0

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/payments/ping > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      customer-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bfsi_pgdata: